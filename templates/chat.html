<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Trading Chat</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; }
      #chat { border: 1px solid #ddd; border-radius: 8px; min-height: 420px; padding: 12px; overflow-y: auto; }
      .msg { margin: 10px 0; padding: 10px; border-radius: 8px; }
      .user { background: #e8f1ff; }
      .assistant { background: #f5f5f5; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      #input { flex: 1; padding: 10px; }
      button { padding: 10px 16px; }
      .muted { color: #666; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>AI Trading Suggestion Chat</h1>
    <p class="muted">Educational tool only. Not financial advice.</p>
    <div id="chat"></div>
    <div class="row">
      <input id="input" placeholder="What suggestion do you have for the next week?" />
      <button id="send">Send</button>
    </div>

    <script>
      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const sendButton = document.getElementById("send");

      function addMessage(role, text) {
        const item = document.createElement("div");
        item.className = `msg ${role}`;
        item.innerText = text;
        chat.appendChild(item);
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage("user", message);
        input.value = "";

        try {
          const response = await fetch("/api/chat/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, risk: "medium" }),
          });

          const payload = await response.json();
          if (!response.ok) {
            addMessage("assistant", `Error: ${payload.error || "request failed"}`);
            return;
          }

          const topPick = payload?.decision?.top_pick || payload?.ranked_candidates?.[0]?.symbol || "N/A";
          const reason = payload?.decision?.reasoning || "No reasoning provided.";
          const answer = payload?.answer || `Top pick for next week: ${topPick}`;
          addMessage("assistant", `${answer}\nTop pick: ${topPick}\nReasoning: ${reason}`);
        } catch (error) {
          addMessage("assistant", `Network error: ${error}`);
        }
      }

      sendButton.addEventListener("click", sendMessage);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
